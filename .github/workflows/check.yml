name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  vocabulary:
    name: Vocabulary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - run: python tools/check.py
